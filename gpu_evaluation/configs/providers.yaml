# Multi-LLM Providers Configuration
providers:
  groq:
    name: "Groq Llama-3.3-70b"
    model: "llama-3.3-70b-versatile"
    api_key_env: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00059
    cost_per_1k_output: 0.00079

  gemini:
    name: "Google Gemini Flash 2.0"
    model: "gemini-2.0-flash-exp"
    api_key_env: "GEMINI_API_KEY"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00010
    cost_per_1k_output: 0.00040

  openai:
    name: "OpenAI GPT-4o-mini"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.00060

  ollama:
    name: "Local Ollama GPU (Llama3 / Mistral)"
    model: "llama3:latest"
    base_url: "http://localhost:11434"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0

  deepseek:
    name: "DeepSeek Chat (V3)"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00014
    cost_per_1k_output: 0.00028

  claude:
    name: "Anthropic Claude 3.5 Sonnet"
    model: "claude-3-5-sonnet-20241022"
    api_key_env: "ANTHROPIC_API_KEY"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00300
    cost_per_1k_output: 0.01500

  openrouter:
    name: "OpenRouter Multi-Model Proxy"
    model: "meta-llama/llama-3.3-70b-instruct"
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00040
    cost_per_1k_output: 0.00040

  cerebras:
    name: "Cerebras Llama-3.1-70b"
    model: "llama3.1-70b"
    api_key_env: "CEREBRAS_API_KEY"
    base_url: "https://api.cerebras.ai/v1"
    max_tokens: 1024
    temperature: 0.1
    cost_per_1k_input: 0.00060
    cost_per_1k_output: 0.00060
